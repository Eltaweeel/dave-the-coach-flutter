<!DOCTYPE html>
<html>
<head>
  <base href="/dave-the-coach-flutter/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dave the COACH SaaS v1 — an installable Flutter web experience for athletes and coaches.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dave the COACH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dave the COACH | Mobile Athlete OS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      background: #050816;
      color: #ffffff;
      font-family: Inter, Arial, sans-serif;
    }
    .boot {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(99,243,255,.18), transparent 26%),
        radial-gradient(circle at bottom right, rgba(141,255,138,.16), transparent 24%),
        linear-gradient(180deg, #03050d 0%, #081120 100%);
    }
    .boot-card {
      padding: 24px 28px;
      border-radius: 24px;
      border: 1px solid rgba(99,243,255,.2);
      background: rgba(11,18,36,.86);
      box-shadow: 0 18px 60px rgba(0,0,0,.4);
      text-align: center;
    }
    .boot-kicker {
      color: #63f3ff;
      font-size: 12px;
      letter-spacing: .14em;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .boot-title {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 10px;
    }
    .boot-copy {
      margin: 0;
      color: #9ba6c7;
      line-height: 1.5;
      max-width: 34ch;
    }
  </style>
</head>
<body>
  <div class="boot" id="boot-shell">
    <div class="boot-card">
      <div class="boot-kicker">DAVE THE COACH</div>
      <h1 class="boot-title">Loading athlete OS…</h1>
      <p class="boot-copy">Preparing the installable athlete and coach workspace.</p>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
